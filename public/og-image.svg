<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="50%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g stroke="#21262D" stroke-width="1" opacity="0.35">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Ambient glowing spots -->
  <circle cx="1050" cy="180" r="220" fill="#10B981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="480" r="240" fill="#3B82F6" opacity="0.10" filter="url(#glow)"/>

  <!-- Logo and Icon container -->
  <g transform="translate(100, 110)">
    <rect width="72" height="72" rx="20" fill="#161B22" stroke="#21262D" stroke-width="2"/>
    <path d="M51 28.5C50.6 27.3 49.5 26.5 48.2 26.5H23.8C22.5 26.5 21.4 27.3 21 28.5L15 45V58C15 59.1 15.9 60 17 60H19C20.1 60 21 59.1 21 58V56H51V58C51 59.1 51.9 60 53 60H55C56.1 60 57 59.1 57 58V45L51 28.5ZM21.5 50C19.8 50 18.5 48.7 18.5 47C18.5 45.3 19.8 44 21.5 44C23.2 44 24.5 45.3 24.5 47C24.5 48.7 23.2 50 21.5 50ZM50.5 50C48.8 50 47.5 48.7 47.5 47C47.5 45.3 48.8 44 50.5 44C52.2 44 53.5 45.3 53.5 47C53.5 48.7 52.2 50 50.5 50ZM18.5 41L21.2 33H50.8L53.5 41H18.5Z" fill="#10B981" transform="translate(-2, -6) scale(1)"/>
  </g>

  <!-- Main Headline -->
  <text x="195" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">
    Ruta Libre
  </text>
  <text x="430" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#10B981" letter-spacing="0.05em">
    • P2P DESCENTRALIZADO
  </text>

  <!-- Value proposition -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">
    Tu viaje en minutos,
  </text>
  <text x="100" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.03em">
    sin intermediarios ni comisiones.
  </text>

  <text x="100" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#8B949E">
    Negocia tarifas directamente en efectivo. Enrutamiento real con GPS y comunicación privada.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 480)">
    <!-- Pill 1 -->
    <rect width="180" height="48" rx="24" fill="#161B22" stroke="#21262D" stroke-width="1.5"/>
    <circle cx="26" cy="24" r="6" fill="#10B981"/>
    <text x="44" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">0% Comisión</text>

    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="210" height="48" rx="24" fill="#161B22" stroke="#21262D" stroke-width="1.5"/>
      <circle cx="26" cy="24" r="6" fill="#3B82F6"/>
      <text x="44" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Efectivo en Mano</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(420, 0)">
      <rect width="210" height="48" rx="24" fill="#161B22" stroke="#21262D" stroke-width="1.5"/>
      <circle cx="26" cy="24" r="6" fill="#F59E0B"/>
      <text x="44" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Cero Registros</text>
    </g>
  </g>

  <!-- Domain badge in bottom right -->
  <g transform="translate(850, 480)">
    <rect width="250" height="48" rx="24" fill="#10B981" opacity="0.15"/>
    <rect width="250" height="48" rx="24" fill="none" stroke="#10B981" stroke-width="1.5"/>
    <text x="125" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace, sans-serif" font-size="16" font-weight="700" fill="#10B981">
      ruta-libre.pages.dev
    </text>
  </g>
</svg>
